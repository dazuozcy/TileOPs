Conv2dFwdOp:
  ref_api: "torch.nn.functional.conv2d"
  family: convolution
  status: scaffolded

  signature:
    inputs:
      input: {dtype: "float16 | bfloat16 | float32", shape: "[N, C_in, H, W]"}
      weight: {dtype: "same_as(input)", shape: "[C_out, C_in_g, kH, kW]"}
    outputs:
      output: {dtype: "same_as(input)", shape: "[N, C_out, out_H, out_W]"}
    params:
      stride: {type: "tuple[int, int]", default: [1, 1]}
      padding: {type: "tuple[int, int]", default: [0, 0]}
      dilation: {type: "tuple[int, int]", default: [1, 1]}
      groups: {type: int, default: 1}
    shape_rules:
    - "C_in % groups == 0"
    - "C_out % groups == 0"
    - "C_in_g == C_in // groups"
    - "out_H == (H + 2 * padding[0] - dilation[0] * (kH - 1) - 1) // stride[0] + 1"
    - "out_W == (W + 2 * padding[1] - dilation[1] * (kW - 1) - 1) // stride[1] + 1"

  workloads:
  - {input_shape: [2, 64, 56, 56], C_out: 64, kH: 3, kW: 3, stride: [1, 1], padding: [1, 1], dilation: [1, 1], groups: 1, dtype: float16, label: "conv-3x3-s1-f16"}
  - {input_shape: [1, 3, 112, 112], C_out: 64, kH: 3, kW: 3, stride: [2, 2], padding: [1, 1], dilation: [1, 1], groups: 1, dtype: float16, label: "conv-3x3-s2-f16"}
  - {input_shape: [2, 64, 56, 56], C_out: 256, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], dilation: [1, 1], groups: 1, dtype: float16, label: "conv-1x1-f16"}
  - {input_shape: [1, 32, 56, 56], C_out: 32, kH: 3, kW: 3, stride: [1, 1], padding: [1, 1], dilation: [1, 1], groups: 32, dtype: float16, label: "conv-dw3x3-f16"}

  roofline:
    func: "perf.formulas.conv2d_fwd_roofline"

  source:
    kernel: kernels/conv2d.py
    kernel_map:
      conv2d_kernel: Conv2dKernel
    op: ops/conv2d.py
    test: tests/ops/test_conv2d.py
    bench: benchmarks/ops/bench_conv2d.py
