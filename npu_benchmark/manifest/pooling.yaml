AvgPool2dFwdOp:
  ref_api: "torch.nn.functional.avg_pool2d"
  family: pooling
  status: scaffolded

  signature:
    inputs:
      input: {dtype: "float16 | bfloat16 | float32", shape: "[N, C, H, W]"}
    outputs:
      output: {dtype: "same_as(input)", shape: "[N, C, out_H, out_W]"}
    params:
      kernel_size: {type: "tuple[int, int]"}
      stride: {type: "tuple[int, int]", default: "kernel_size"}
      padding: {type: "tuple[int, int]", default: [0, 0]}
      ceil_mode: {type: bool, default: false}
      count_include_pad: {type: bool, default: true}
    shape_rules:
    - "out_H == floor((H + 2*padding[0] - kernel_size[0]) / stride[0]) + 1  (ceil_mode=false)"
    - "out_W == floor((W + 2*padding[1] - kernel_size[1]) / stride[1]) + 1  (ceil_mode=false)"

  workloads:
  - {input_shape: [2, 64, 56, 56], kernel_size: 3, stride: [2, 2], padding: [1, 1], ceil_mode: false, count_include_pad: true, dtype: float16, label: "avgpool-3x3-s2-f16"}
  - {input_shape: [1, 3, 112, 112], kernel_size: 3, stride: [2, 2], padding: [1, 1], ceil_mode: false, count_include_pad: true, dtype: float16, label: "avgpool-3x3-s2-112-f16"}
  - {input_shape: [2, 64, 56, 56], kernel_size: 2, stride: [2, 2], padding: [0, 0], ceil_mode: false, count_include_pad: true, dtype: float32, label: "avgpool-2x2-s2-f32"}
  - {input_shape: [2, 128, 28, 28], kernel_size: 3, stride: [1, 1], padding: [1, 1], ceil_mode: false, count_include_pad: false, dtype: float16, label: "avgpool-3x3-s1-nopad-f16"}

  roofline:
    func: "perf.formulas.avg_pool2d_fwd_roofline"

  source:
    kernel: kernels/avg_pool2d.py
    kernel_map:
      avg_pool2d_kernel: AvgPool2dKernel
    op: ops/avg_pool2d.py
    test: tests/ops/test_avg_pool2d.py
    bench: benchmarks/ops/bench_avg_pool2d.py

MaxPool3dFwdOp:
  ref_api: "torch.nn.functional.max_pool3d"
  family: pooling
  status: scaffolded

  signature:
    inputs:
      input: {dtype: "float16 | bfloat16 | float32", shape: "[N, C, D, H, W]"}
    outputs:
      output: {dtype: "same_as(input)", shape: "[N, C, out_D, out_H, out_W]"}
    params:
      kernel_size: {type: "tuple[int, int, int]"}
      stride: {type: "tuple[int, int, int]", default: "kernel_size"}
      padding: {type: "tuple[int, int, int]", default: [0, 0, 0]}
      dilation: {type: "tuple[int, int, int]", default: [1, 1, 1]}
      ceil_mode: {type: bool, default: false}
    shape_rules:
    - "out_D == floor((D + 2*padding[0] - dilation[0]*(kernel_size[0]-1) - 1) / stride[0]) + 1  (ceil_mode=false)"
    - "out_H == floor((H + 2*padding[1] - dilation[1]*(kernel_size[1]-1) - 1) / stride[1]) + 1  (ceil_mode=false)"
    - "out_W == floor((W + 2*padding[2] - dilation[2]*(kernel_size[2]-1) - 1) / stride[2]) + 1  (ceil_mode=false)"

  workloads:
  - {input_shape: [1, 32, 16, 56, 56], kernel_size: 3, stride: [2, 2, 2], padding: [1, 1, 1], dilation: [1, 1, 1], ceil_mode: false, dtype: float16, label: "maxpool3d-3x3x3-s2-f16"}
  - {input_shape: [1, 64, 8, 28, 28], kernel_size: 3, stride: [1, 1, 1], padding: [1, 1, 1], dilation: [1, 1, 1], ceil_mode: false, dtype: float16, label: "maxpool3d-3x3x3-s1-f16"}
  - {input_shape: [1, 32, 16, 56, 56], kernel_size: 2, stride: [2, 2, 2], padding: [0, 0, 0], dilation: [1, 1, 1], ceil_mode: false, dtype: float32, label: "maxpool3d-2x2x2-s2-f32"}
  - {input_shape: [2, 32, 8, 28, 28], kernel_size: 3, stride: [2, 2, 2], padding: [1, 1, 1], dilation: [1, 1, 1], ceil_mode: false, dtype: bfloat16, label: "maxpool3d-3x3x3-s2-bf16"}

  roofline:
    func: "perf.formulas.max_pool3d_fwd_roofline"

  source:
    kernel: kernels/max_pool3d.py
    kernel_map:
      max_pool3d_kernel: MaxPool3dKernel
    op: ops/max_pool3d.py
    test: tests/ops/test_max_pool3d.py
    bench: benchmarks/ops/bench_max_pool3d.py
