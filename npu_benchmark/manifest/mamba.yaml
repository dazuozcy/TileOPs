# mamba.yaml -- manifest entries for the 'mamba' (Mamba-2 / SSD) family.
#
# Source of truth for op interfaces in this family. Loaded and merged with
# other family files by manifest.__init__ at runtime.
#
# Dim-name conventions:
#   B  batch          S  seq_len (= NC * Q)   H  n_heads
#   P  d_head          N  d_state              G  n_groups (H % G == 0)
#   NC num_chunks     Q  chunk_len

SSDChunkScanFwdOp:
  # Fused SSD chunk output: history contribution exp(dA[l]) * (C[l] @
  # prev_states) plus the causal intra-chunk path over cb.
  ref_api: "none"
  family: mamba
  status: scaffolded

  signature:
    inputs:
      x: {dtype: "float16 | bfloat16", shape: "[B, S, H, P]"}
      cb: {dtype: "same_as(x)", shape: "[B, NC, G, Q, Q]"}
      dA_cumsum: {dtype: "float32", shape: "[B, H, NC, Q]"}
      C: {dtype: "same_as(x)", shape: "[B, S, G, N]"}
      prev_states: {dtype: "float32", shape: "[B, NC, H, P, N]"}
      dt: {dtype: "same_as(x)", shape: "[B, H, NC, Q]"}
    outputs:
      y: {dtype: "float32", shape: "[B, S, H, P]"}
    params: {}
    shape_rules:
    - "S == NC * Q"
    - "H % G == 0"

  workloads:
  - {x_shape: [1, 256, 8, 64], cb_shape: [1, 4, 1, 64, 64], dA_cumsum_shape: [1, 8, 4, 64], C_shape: [1, 256, 1, 128], prev_states_shape: [1, 4, 8, 64, 128], dt_shape: [1, 8, 4, 64], dtype: float16, label: "ssd-scan-b1-s256-h8-p64-f16"}
  - {x_shape: [1, 512, 16, 64], cb_shape: [1, 8, 1, 64, 64], dA_cumsum_shape: [1, 16, 8, 64], C_shape: [1, 512, 1, 128], prev_states_shape: [1, 8, 16, 64, 128], dt_shape: [1, 16, 8, 64], dtype: float16, label: "ssd-scan-b1-s512-h16-p64-f16"}
  - {x_shape: [1, 512, 16, 64], cb_shape: [1, 8, 1, 64, 64], dA_cumsum_shape: [1, 16, 8, 64], C_shape: [1, 512, 1, 128], prev_states_shape: [1, 8, 16, 64, 128], dt_shape: [1, 16, 8, 64], dtype: bfloat16, label: "ssd-scan-b1-s512-h16-p64-bf16"}
  - {x_shape: [2, 1024, 32, 64], cb_shape: [2, 16, 1, 64, 64], dA_cumsum_shape: [2, 32, 16, 64], C_shape: [2, 1024, 1, 128], prev_states_shape: [2, 16, 32, 64, 128], dt_shape: [2, 32, 16, 64], dtype: float16, label: "ssd-scan-b2-s1024-h32-p64-f16"}

  roofline:
    func: "perf.formulas.ssd_chunk_scan_fwd_roofline"

  source:
    kernel: kernels/ssd_chunk_scan.py
    kernel_map:
      ssd_chunk_scan_fwd: SSDChunkScanFwdKernel
    op: ops/ssd_chunk_scan.py
    test: tests/ops/test_ssd_chunk_scan.py
    bench: benchmarks/ops/bench_ssd_chunk_scan.py
